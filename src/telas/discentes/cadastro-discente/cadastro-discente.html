<div class="container">
    <div class="head">
        <h1>CADASTRO DISCENTE</h1>
        <button mat-raised-button color="primary" [routerLink]="['/']" style="position: absolute; right: 40px;">Home</button>
    </div>
    <div class="areaCadastro">
        <div>
            <div class="label-input">Nome do Aluno</div>
            <div class="pesquisa">
                <input
                class="input-text"
                type="text" 
                placeholder="Digite o nome" 
                />
            </div>
            <div class="label-input">E-mail(s)</div>
            <div class="pesquisa">
                <input 
                type="text" 
                placeholder="Digite o e-mail" 
                class="input-text"
                />
            </div>
            <div class="label-input">Lattes</div>
            <div class="pesquisa">
                <input 
                type="text" 
                placeholder="Insira o link para o currículo lattes" 
                class="input-text"
                />
            </div>
             <div class="div-select">
                    <div class="label-input">Orientador</div>
                    <select style="height: 40px; font-size: 18px; padding-left: 5px;">
                            <option>Van Sergio</option>
                            <option>Danilo Teixeira Machado da Silva</option>
                    </select>
                </div>
            <div class="container-select">
                <div class="div-select">
                    <div class="label-input">Data de Ingresso</div>
                    <input type="date" style="height: 40px; font-size: 18px; padding-left: 5px;">
                </div>
                <div class="div-select">
                    <div class="label-input">Grau</div>
                    <select style="height: 40px; font-size: 18px; padding-left: 5px;">
                            <option>Mestrado</option>
                            <option>Doutorado</option>
                    </select>
                </div>
                <div class="div-select" >
                    <div class="label-input">Tipo de Bolsa</div>
                    <select style="height: 40px; font-size: 18px; padding-left: 5px;">
                            <option>Nenhuma</option>
                            <option>CNPQ</option>
                    </select>
                </div>                          
            </div>            
        </div>
        <div>



        </div>
    </div>
</div>
