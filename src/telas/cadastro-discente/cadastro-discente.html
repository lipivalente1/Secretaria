<div class="container">
    <div class="head">
        <h1>CADASTRO DISCENTE</h1>
        <button [routerLink]="['/']" style="position: absolute; right: 40px;">Home</button>
    </div>
    <div class="areaCadastro">
        <div>
            <div class="label-input">Nome do Aluno</div>
            <div class="pesquisa">
                <input
                class="input-text"
                type="text" 
                placeholder="Digite o nome" 
                />
            </div>
            <div class="label-input">E-mail</div>
            <div class="pesquisa">
                <input 
                type="text" 
                placeholder="Digite o e-mail" 
                class="input-text"
                />
            </div>
            <div class="label-input">Lattes</div>
            <div class="pesquisa">
                <input 
                type="text" 
                placeholder="Insira o link para o currículo lattes" 
                class="input-text"
                />
            </div>
            <div>
                    <div class="label-input">Ingresso</div>
                    <div class="pesquisa">
                        <input type="date">
                        <select>
                            <option>Mestrado</option>
                            <option>Doutorado</option>
                        </select>
                        <select>
                            <option>Nenhuma</option>
                            <option>CNPQ</option>
                        </select>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>
