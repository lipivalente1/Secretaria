<div style="background-color: aqua; width: auto; height: 100vh;">

            <h1>PROFESSORES PPGF</h1>
            <button mat-raised-button color="primary" [routerLink]="['/']" style="position: absolute; right: 40px;">Home</button>
    </div>
    <div>

            <button mat-raised-button color="primary" [routerLink]="['/']" style="margin-bottom: 20px;"> Cadastrar Docente </button>
